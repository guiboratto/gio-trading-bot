<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GIO Whale Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           margin: 0; padding: 0; background: #0e0f12; color: #e8eaed; }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 13px; margin: 24px 0 8px; color: #9aa0a6; text-transform: uppercase; letter-spacing: 0.06em; }
    .card { background: #1a1c20; border-radius: 12px; padding: 14px; margin: 8px 0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .small { font-size: 12px; color: #9aa0a6; }
    .pnl-big { font-size: 28px; font-weight: 700; }
    .signal { padding: 8px; border-left: 3px solid #3a7afe; background: #1a1c20; margin: 4px 0; border-radius: 0 8px 8px 0; }
    .loading { color: #9aa0a6; padding: 16px; }
  </style>
</head>
<body>
<div class="app">
  <h1>🐋 GIO Whale Tracker</h1>
  <div class="small">Signals · Whales · Testnet Trading</div>

  <h2>Live Signals</h2>
  <div class="card" id="signals"><div class="loading">Loading...</div></div>

  <h2>Whales (ETH flow)</h2>
  <div class="card" id="whales"><div class="loading">Loading...</div></div>

  <h2>Binance Testnet</h2>
  <div class="card" id="account"><div class="loading">Loading...</div></div>

  <h2>Fear & Greed</h2>
  <div class="card" id="sentiment"><div class="loading">Loading...</div></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
const params = new URLSearchParams(location.search);
const uid = tg?.initDataUnsafe?.user?.id || parseInt(params.get('uid')) || 0;
tg?.ready();
tg?.expand();

async function load(path) {
  try {
    const r = await fetch(path);
    return await r.json();
  } catch (e) { return { error: String(e) }; }
}

async function loadAll() {
  const [sig, whales, account] = await Promise.all([
    load('/api/signals'),
    load('/api/whales'),
    load('/api/account'),
  ]);

  // signals
  const sigEl = document.getElementById('signals');
  if (sig.error) {
    sigEl.innerHTML = `<div class="small">err: ${sig.error}</div>`;
  } else if (sig.signals && sig.signals.length) {
    sigEl.innerHTML = sig.signals.slice(0, 6).map(s => {
      const usd = Math.round(s.amount_usd || 0).toLocaleString();
      const extra = s.change_pct ? ` <span class="small">(${s.change_pct.toFixed(1)}%)</span>` : '';
      return `<div class="signal"><strong>${s.asset || '?'}</strong> · ${s.source} · ${s.direction} · $${usd}${extra}</div>`;
    }).join('') + (sig.sentiment ? `<div class="small" style="margin-top:8px">F&G: ${sig.sentiment.value} (${sig.sentiment.classification})</div>` : '');
  } else {
    sigEl.innerHTML = `<div class="small">${sig.note || 'No signals'}</div>`;
  }

  // whales
  const wEl = document.getElementById('whales');
  if (whales.error) {
    wEl.innerHTML = `<div class="small">err: ${whales.error}</div>`;
  } else if (whales.txs && whales.txs.length) {
    wEl.innerHTML = whales.txs.slice(0, 5).map(tx => {
      const v = parseFloat(tx.value).toFixed(4);
      return `<div class="small">${v} ETH<br>${tx.from.slice(0,10)}... → ${tx.to.slice(0,10)}...</div>`;
    }).join('');
  } else {
    wEl.innerHTML = `<div class="small">No recent tx</div>`;
  }

  // account
  const aEl = document.getElementById('account');
  if (account.error) {
    aEl.innerHTML = `<div class="small">err: ${account.error}</div>`;
  } else if (account.balances) {
    aEl.innerHTML = account.balances.slice(0, 6).map(b =>
      `<div class="row"><strong>${b.asset}</strong><span class="small">free ${b.free}</span></div>`
    ).join('') || '<div class="small">No non-zero balances</div>';
  } else {
    aEl.innerHTML = '<div class="small">No data</div>';
  }

  // sentiment
  const sEl = document.getElementById('sentiment');
  if (sig.sentiment) {
    sEl.innerHTML = `<div class="pnl-big">${sig.sentiment.value}</div><div class="small">${sig.sentiment.classification}</div>`;
  } else {
    sEl.innerHTML = '<div class="small">n/a</div>';
  }
}

loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
